[project]
name = "eldwyld-river"
version = "0.1.0"
description = "River API experiments for the Eldwyld Archives"
requires-python = ">=3.12"
dependencies = [
    "river-client>=0.6.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Only needed by rl.py, which trains on the GSM8K dataset.
rl = [
    "datasets>=2.0.0",
    "jinja2>=3.0.0",
]
