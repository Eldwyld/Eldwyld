<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../forager-grimoire/src/fonts/fonts-local.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1000px; height:1500px; overflow:hidden; }
body {
  background: radial-gradient(900px 700px at 50% -8%, #232a20 0%, #171c15 55%, #0f120e 100%);
  color:#ece4d2; font-family:'Cormorant Garamond', serif; position:relative;
}
.frame { position:absolute; inset:34px; border:2px solid #8d7a55; }
.frame::before { content:''; position:absolute; inset:10px; border:1px solid #55492f; }
.wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:space-between; text-align:center; padding:92px 70px 84px; }
.kicker { font-family:'Cinzel', serif; font-size:21px; letter-spacing:.42em; color:#b49a6d; text-transform:uppercase; }
h1 { font-family:'Cinzel Decorative', serif; font-weight:400; font-size:64px; line-height:1.12; margin:16px 0 10px; color:#f3ecdb;
     font-variant-ligatures:none; font-feature-settings:'liga' 0,'dlig' 0; }
.sub { font-family:'IM Fell English', serif; font-style:italic; font-size:27px; color:#c9bda1; }
.mock { position:relative; width:100%; height:790px; }
.mock img { position:absolute; box-shadow:0 30px 60px rgba(0,0,0,.65); border-radius:3px; }
.pgL { width:370px; left:16px; top:78px; transform:rotate(-7deg); }
.cov { width:480px; left:50%; top:10px; transform:translateX(-50%) rotate(1.5deg); z-index:2; }
.pgR { width:370px; right:16px; top:90px; transform:rotate(6deg); }
.badge { font-family:'Cinzel', serif; font-size:23px; letter-spacing:.24em; text-transform:uppercase;
  color:#10130f; background:#b49a6d; padding:17px 36px; }
.brand { margin-top:26px; font-family:'Cinzel', serif; font-size:20px; letter-spacing:.4em; color:#8d7a55; text-transform:uppercase; }
</style></head><body>
<div class="frame"></div>
<div class="wrap">
  <div>
    <p class="kicker">Printable · US Letter + A4</p>
    <h1>The Witch's Almanac</h1>
    <p class="sub">the undated witch’s planner — sabbats, moons &amp; seasons, forever</p>
  </div>
  <div class="mock">
    <img class="pgL" src="../../dist/pages/page-06.png">
    <img class="pgR" src="../../dist/pages/page-11.png">
    <img class="cov" src="../../dist/pages/page-01.png">
  </div>
  <div>
    <p class="badge">Instant Download</p>
    <p class="brand">✦ spiralsightedvisions ✦</p>
  </div>
</div>
</body></html>
